<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>DC Metro Board</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #232323;
        color: #E5E5E5;
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      #app {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main { width: 100%; max-width: 460px; }
      h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
      .sub { font-size: 12px; color: #919191; margin: 0 0 16px; }
      pre {
        background: #2E2E2E;
        border: 1px solid #3E3E3E;
        border-radius: 12px;
        padding: 18px;
        font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
        word-break: break-word;
        color: #B6F2B6;
        margin: 0;
        min-height: 220px;
      }
      footer { font-size: 12px; color: #7B7B7B; text-align: center; margin-top: 14px; }
    </style>
  </head>
  <body>
    <div id="app">
      <main>
        <h1>DC Metro Board</h1>
        <p class="sub" id="status">Starting…</p>
        <pre id="mirror">Check the glasses display.</pre>
        <footer>Tap glasses: refresh now · double-tap: exit</footer>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
